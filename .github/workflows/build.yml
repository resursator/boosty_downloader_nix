name: Build packages

on:
  push:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'cli.nix'
      - 'gui.nix'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'cli.nix'
      - 'gui.nix'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  should-build:
    name: Check whether build is needed
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check event
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT: ${{ github.event_name }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Не собираем PR из bot/*
          if [[ "$GH_EVENT" == "pull_request" ]]; then
            if [[ "$GH_HEAD_REF" == bot/* ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Для push в ветку проверяем, не является ли коммит
          # merge-коммитом автоматического PR из bot/*.
          if [[ "$GH_EVENT" == "push" && "$GH_REF" == "refs/heads/main" ]]; then
            prs="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GH_REPOSITORY/commits/$GH_SHA/pulls")"

            if jq -e 'any(.[]; (.head.ref | startswith("bot/")) and .merged_at != null)' \
              <<< "$prs" >/dev/null; then
              echo "Skipping build: commit belongs to a merged bot PR"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build packages
    needs: should-build
    if: needs.should-build.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CLI
        run: nix build .#cli --no-link --print-build-logs

      - name: Build GUI
        run: nix build .#gui --no-link --print-build-logs
